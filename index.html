<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>素材雷达 · 11-05</title>
<style>
  :root {
    --bg: #f7f8fa;
    --bg-elev: #eef0f4;
    --bg-card: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #111827;
    --text-muted: #4b5563;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --green: #16a34a;
    --green-soft: #ecfdf5;
    --amber: #d97706;
    --amber-soft: #fffbeb;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05);
    --radius: 14px;
    --gap: 28px;
    --max: 1080px;
    --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
      system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle editorial grain / top wash */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37,99,235,0.06), transparent 55%),
      radial-gradient(ellipse 40% 30% at 100% 0%, rgba(15,23,42,0.02), transparent 40%);
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  /* ——— Top bar ——— */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    background: rgba(255,255,255,0.88);
    border-bottom: 1px solid var(--border);
    margin: 0 -20px;
    padding: 16px 20px 14px;
  }

  .topbar-inner {
    max-width: var(--max);
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
  }

  .brand h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .brand .date {
    margin-top: 4px;
    font-size: 0.8125rem;
    color: var(--text-muted);
  }

  .segments {
    display: inline-flex;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .segments button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 560;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .segments button:hover { color: var(--text); }

  .segments button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 1px 2px rgba(37,99,235,0.25);
  }

  /* ——— Lead ——— */
  .lead {
    margin-top: 28px;
    padding: 18px 20px;
    background: linear-gradient(135deg, #eff6ff, #f8fafc);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius);
  }

  .lead .kicker {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .lead p {
    font-size: 0.975rem;
    color: var(--text);
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .meta-row span strong {
    color: var(--text-muted);
    font-weight: 600;
  }

  /* ——— Grid ——— */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--gap);
    margin-top: 28px;
  }

  @media (min-width: 760px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  /* ——— Card ——— */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 2px);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
  }

  .card:hover {
    border-color: var(--border-strong);
    box-shadow: 0 2px 4px rgba(15,23,42,0.05), 0 8px 20px rgba(15,23,42,0.07);
    transform: translateY(-1px);
  }

  .cover {
    position: relative;
    aspect-ratio: 16 / 9;
    width: 100%;
    max-height: 180px;
    background: #111827;
    overflow: hidden;
  }

  .cover.is-portrait {
    aspect-ratio: 9 / 16;
    width: 112px;
    max-height: 200px;
    margin: 12px auto 0;
    border-radius: 10px;
  }

  .cover.is-square {
    aspect-ratio: 1 / 1;
    width: 180px;
    max-height: 180px;
    margin: 12px auto 0;
    border-radius: 10px;
  }

  .cover.no-img {
    display: none;
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(145deg, #eef0f4 0%, #e5e7eb 100%);
    color: var(--text-dim);
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    user-select: none;
  }

  .cover-placeholder span {
    opacity: 0.45;
  }

  .cover-badges {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 2;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 9px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid transparent;
  }

  .badge-NEW, .badge-主榜 {
    background: var(--accent-soft);
    color: #1d4ed8;
    border-color: #bfdbfe;
  }

  .badge-Rising {
    background: var(--green-soft);
    color: #15803d;
    border-color: #bbf7d0;
  }

  .badge-Trending, .badge-仍在爆 {
    background: var(--amber-soft);
    color: #b45309;
    border-color: #fde68a;
  }

  .card-body {
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }

  .card-stats {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .card-analysis {
    font-size: 0.9rem;
    color: #374151;
    flex: 1;
  }

  .card-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .card-links a {
    font-size: 0.8125rem;
    color: #2563eb;
    text-decoration: none;
    line-height: 1.4;
    word-break: break-word;
  }

  .card-links a:hover {
    color: #1d4ed8;
    text-decoration: underline;
  }

  .card-links a::before {
    content: "↗ ";
    opacity: 0.7;
  }

  .extra-thumbs {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }

  .extra-thumbs img {
    width: 72px;
    aspect-ratio: 16 / 9;
    height: auto;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #e5e7eb;
  }

  .extra-thumbs img.is-portrait {
    width: 56px;
    aspect-ratio: 9 / 16;
  }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
  }


  .badge-新出路 {
    background: var(--accent-soft);
    color: #1d4ed8;
    border-color: #bfdbfe;
  }

  .badge-上升速 {
    background: var(--green-soft);
    color: #15803d;
    border-color: #bbf7d0;
  }

  .badge-持续 {
    background: var(--amber-soft);
    color: #b45309;
    border-color: #fde68a;
  }

  /* ——— YouTube 热点 ——— */
  .yt-section {
    margin-top: 32px;
  }

  .yt-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 16px;
    margin-bottom: 16px;
  }

  .yt-head h2 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .yt-updated {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .yt-themes {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .yt-theme {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 2px);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    transition: border-color 0.18s;
  }

  .yt-theme:hover {
    border-color: var(--border-strong);
  }

  .yt-theme-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
    margin-bottom: 10px;
  }

  .yt-theme-head h3 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .yt-judgment {
    font-size: 0.9rem;
    color: #374151;
    line-height: 1.55;
    margin-bottom: 14px;
  }

  .yt-evidence {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  @media (min-width: 720px) {
    .yt-evidence {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  .yt-ev {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    transition: border-color 0.15s, transform 0.15s;
    min-width: 0;
  }

  .yt-ev:hover {
    border-color: #93c5fd;
    transform: translateY(-1px);
  }

  .yt-ev-thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #e5e7eb;
    overflow: hidden;
  }

  .yt-ev-thumb.is-portrait {
    aspect-ratio: 9 / 16;
    width: 96px;
    max-height: 170px;
    margin: 0 auto;
    border-radius: 8px;
  }

  .yt-ev-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .yt-ev-play {
    position: absolute;
    right: 6px;
    bottom: 6px;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    letter-spacing: 0.02em;
  }

  .yt-ev-meta {
    padding: 8px 9px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .yt-ev-title {
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .yt-ev-views {
    font-size: 0.68rem;
    color: var(--text-dim);
  }

  .yt-hint {
    margin-top: 28px;
    padding: 14px 16px;
    background: var(--bg-elev);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .yt-hint a {
    color: #2563eb;
    text-decoration: none;
  }

  .yt-hint a:hover { text-decoration: underline; }

  .section-label {
    margin-top: 36px;
    margin-bottom: -12px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }


  /* ——— 竞品投放日更 ——— */
  .compads-section {
    margin-top: 32px;
  }
  .compads-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 16px;
    margin-bottom: 14px;
  }
  .compads-head h2 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .compads-updated {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .compads-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--gap);
  }
  @media (min-width: 720px) {
    .compads-grid { grid-template-columns: 1fr 1fr; }
  }
  .badge-新开投 {
    background: var(--accent-soft);
    color: #1d4ed8;
    border-color: #bfdbfe;
  }
  .badge-在投 {
    background: var(--bg-elev);
    color: #374151;
    border-color: var(--border);
  }
  .badge-仿冒, .badge-⚠️仿冒 {
    background: #fef2f2;
    color: #b91c1c;
    border-color: #fecaca;
  }
  .compads-empty {
    margin-top: 8px;
    padding: 14px 16px;
    background: var(--bg-elev);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .hidden { display: none !important; }
</style>
</head>

function thumbSrc(t) {
  if (!t) return null;
  if (t.type === "yt") {
    return {
      primary: `https://i.ytimg.com/vi/${t.id}/maxresdefault.jpg`,
      fallback: `https://i.ytimg.com/vi/${t.id}/hqdefault.jpg`
    };
  }
  if (t.type === "x") {
    return { primary: `media/x_${t.id}.jpg`, fallback: null };
  }
  if (t.type === "local" && t.src) {
    return { primary: t.src, fallback: null };
  }
  if (t.type === "local") {
    return { primary: t.src, fallback: t.fallback || null };
  }
  return null;
}

function isPortraitUrl(url) {
  if (!url) return false;
  const u = String(url);
  return /youtube\.com\/shorts\//i.test(u) || /\/shorts\//i.test(u);
}

function isPortraitThumb(t, links) {
  if (!t) return false;
  if (t.portrait === true || t.orient === "portrait" || t.ar === "9:16") return true;
  if (t.portrait === false || t.orient === "landscape" || t.ar === "16:9") return false;
  if (Array.isArray(links) && links.some(l => isPortraitUrl(l && l.href))) return true;
  return false;
}

function markPortraitFromImg(img) {
  if (!img || !img.naturalWidth) return;
  const box = img.closest(".cover, .yt-ev-thumb") || img;
  // YouTube Shorts 的 maxres 常是 16:9 带黑边，不能据此取消竖屏；只在图本身更高时补标竖屏
  if (img.naturalHeight > img.naturalWidth * 1.08) {
    box.classList.add("is-portrait");
    img.classList.add("is-portrait");
  }
  else if (box.classList.contains("cover") && !box.classList.contains("is-portrait") && img.naturalHeight >= img.naturalWidth * 0.92) {
    // 方形素材（如 1:1）按真实比例显示，不裁成横版
    box.classList.add("is-square");
  }
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function badgeClass(badge) {
  const known = ["NEW", "主榜", "Rising", "Trending", "仍在爆", "新出路", "上升速", "持续"];
  return known.includes(badge) ? `badge badge-${badge}` : "badge badge-NEW";
}

function renderCover(card) {
  const thumbs = card.thumbs || [];
  const main = thumbs[0];
  const src = thumbSrc(main);
  const letter = (card.title || "?").trim().charAt(0);
  const portrait = isPortraitThumb(main, card.links);

  let coverInner;
  if (src) {
    const onerr = src.fallback
      ? `onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${esc(src.fallback)}';}else{this.replaceWith(Object.assign(document.createElement('div'),{className:'cover-placeholder',innerHTML:'<span>${esc(letter)}</span>'}));}"`
      : `onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cover-placeholder',innerHTML:'<span>${esc(letter)}</span>'}));"`;
    coverInner = `<img src="${esc(src.primary)}" alt="${esc(card.title)}" loading="lazy" decoding="async" onload="markPortraitFromImg(this)" ${onerr} />`;
  } else {
    coverInner = `<div class="cover-placeholder"><span>${esc(letter)}</span></div>`;
  }

  return `
    <div class="cover${portrait ? " is-portrait" : ""}">
      <div class="cover-badges"><span class="${badgeClass(card.badge)}">${esc(card.badge)}</span></div>
      ${coverInner}
    </div>`;
}

function renderCard(card) {
  const extra = (card.thumbs || []).slice(1);
  const extraHtml = extra.length
    ? `<div class="extra-thumbs">${extra.map(t => {
        const s = thumbSrc(t);
        if (!s) return "";
        const onerr = s.fallback
          ? `onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${esc(s.fallback)}';}else{this.remove();}"`
          : `onerror="this.remove();"`;
        const port = isPortraitThumb(t, card.links) ? " is-portrait" : "";
        return `<img class="${port.trim()}" src="${esc(s.primary)}" alt="" loading="lazy" onload="markPortraitFromImg(this)" ${onerr} />`;
      }).join("")}</div>`
    : "";

  const links = (card.links || [])
    .map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a>`)
    .join("");

  return `
    <article class="card">
      ${renderCover(card)}
      <div class="card-body">
        <h2 class="card-title">${esc(card.title)}</h2>
        <div class="card-stats">${esc(card.stats)}</div>
        <p class="card-analysis">${esc(card.analysis)}</p>
        ${extraHtml}
        <div class="card-links">${links}</div>
      </div>
    </article>`;
}

function renderEvidence(ev) {
  const thumb = ev.thumb || ev.thumbnail || (ev.id ? `https://i.ytimg.com/vi/${ev.id}/maxresdefault.jpg` : "");
  const fallback = ev.id ? `https://i.ytimg.com/vi/${ev.id}/hqdefault.jpg` : "";
  const views = ev.views_label ? `${esc(ev.views_label)}播放` : (ev.stats ? esc(String(ev.stats).split("·")[0].trim()) : "");
  const dur = ev.duration_label ? esc(ev.duration_label) : "";
  const portrait = ev.portrait === true || isPortraitUrl(ev.url) || (ev.format === "shorts");
  const onerr = fallback
    ? `onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${esc(fallback)}';}else{this.style.opacity='0.3';}"`
    : "";
  return `
    <a class="yt-ev" href="${esc(ev.url || '#')}" target="_blank" rel="noopener noreferrer" title="${esc(ev.title || '')}">
      <div class="yt-ev-thumb${portrait ? " is-portrait" : ""}">
        <img src="${esc(thumb)}" alt="${esc(ev.title || '')}" loading="lazy" decoding="async" onload="markPortraitFromImg(this)" ${onerr} />
        ${dur ? `<span class="yt-ev-play">${dur}</span>` : ""}
      </div>
      <div class="yt-ev-meta">
        <div class="yt-ev-title">${esc(ev.title || "")}</div>
        <div class="yt-ev-views">${views}${ev.channel ? " · " + esc(ev.channel) : ""}</div>
      </div>
    </a>`;
}

function renderYtTheme(theme) {
  const evidence = (theme.evidence || []).slice(0, 4);
  return `
    <article class="yt-theme">
      <div class="yt-theme-head">
        <span class="${badgeClass(theme.badge)}">${esc(theme.badge || "")}</span>
        <h3>${esc(theme.title || "")}</h3>
      </div>
      <p class="yt-judgment">${esc(theme.judgment || "")}</p>
      <div class="yt-evidence">${evidence.map(renderEvidence).join("")}</div>
    </article>`;
}

function renderYtSection(viewKey) {
  const section = document.getElementById("yt-section");
  const hint = document.getElementById("yt-hint");
  const label = document.getElementById("cards-label");
  const themesEl = document.getElementById("yt-themes");
  const updatedEl = document.getElementById("yt-updated");

  const showFull = viewKey === "weekly" || viewKey === "overseas";
  const yd = (typeof ytByView !== "undefined" && ytByView[viewKey]) || ytData;
  const showHint = viewKey === "korea";

  if (showFull && yd && (yd.themes || []).length) {
    section.classList.remove("hidden");
    hint.classList.add("hidden");
    label.classList.remove("hidden");
    const upd = yd.updated || "";
    const win = yd.window ? ` · ${yd.window}` : "";
    updatedEl.textContent = upd ? `更新 ${upd}${win}` : "";
    themesEl.innerHTML = yd.themes.map(renderYtTheme).join("");
  } else if (showHint) {
    section.classList.add("hidden");
    themesEl.innerHTML = "";
    hint.classList.remove("hidden");
    hint.innerHTML = `YouTube 热点（海外市场）详见 <a href="#overseas">海外日报</a> 或 <a href="#weekly">周报</a>。`;
    label.classList.remove("hidden");
  } else {
    section.classList.add("hidden");
    hint.classList.add("hidden");
    label.classList.add("hidden");
    themesEl.innerHTML = "";
  }
}


function filterCompads(viewKey) {
  const items = (typeof COMPADS !== "undefined" && COMPADS && COMPADS.items) ? COMPADS.items : [];
  if (viewKey === "korea") {
    return items.filter(it => (it.regions || []).includes("KR"));
  }
  if (viewKey === "overseas") {
    // KR-only items belong to the Korea view (added 2026-11-02 by KR daily)
    return items.filter(it => { const r = it.regions || []; return !(r.length === 1 && r[0] === "KR"); });
  }
  if (viewKey === "weekly") {
    return (typeof WEEKLY_COMPADS !== "undefined" && WEEKLY_COMPADS && WEEKLY_COMPADS.items) ? WEEKLY_COMPADS.items : [];
  }
  return [];
}

function hasUsableCover(cover) {
  if (!cover) return false;
  const c = String(cover);
  // Meta fbcdn / remote CDN covers expire or 403 — only local media counts for the page
  if (c.startsWith("media/")) return true;
  if (c.startsWith("./media/")) return true;
  if (c.startsWith("/media/")) return true;
  return false;
}

function renderCompadsCard(it) {
  const badge = it.badge || (it.is_new ? "新开投" : "在投");
  const cover = it.cover || "";
  if (!hasUsableCover(cover)) return "";
  const coverHtml = `<div class="cover"><img src="${esc(cover)}" alt="" loading="lazy" decoding="async" onload="markPortraitFromImg(this)" onerror="this.closest('article')?.remove();" /></div>`;
  const link = it.link
    ? `<div class="card-links"><a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">查看广告</a></div>`
    : "";
  const plat = ({meta:"Meta", google:"Google", tiktok:"TikTok"}[it.platform] || it.platform || "");
  const regs = (it.regions || []).join("/");
  return `
    <article class="card">
      ${coverHtml}
      <div class="card-body">
        <span class="${badgeClass(badge)}">${esc(badge)}</span>
        <h2 class="card-title">${esc(it.title || (it.competitor + " · " + plat))}</h2>
        <div class="card-stats">${esc(it.stats || [plat, regs, it.first_shown ? ("首投 " + it.first_shown) : ""].filter(Boolean).join(" · "))}</div>
        <p class="card-analysis">${esc(it.analysis || it.copy || "")}</p>
        ${link}
      </div>
    </article>`;
}

function renderCompads(viewKey) {
  const section = document.getElementById("compads-section");
  const grid = document.getElementById("compads-grid");
  const empty = document.getElementById("compads-empty");
  const updated = document.getElementById("compads-updated");
  if (!section || !grid) return;
  const items = filterCompads(viewKey);
  const h2 = section.querySelector("h2");
  if (h2) h2.textContent = viewKey === "weekly" ? "竞品本周新开投" : "竞品投放日更";
  if (viewKey === "weekly" && !items.length) {
    section.classList.add("hidden");
    return;
  }
  section.classList.remove("hidden");
  const upd = viewKey === "weekly"
    ? ((typeof WEEKLY_COMPADS !== "undefined" && WEEKLY_COMPADS) ? WEEKLY_COMPADS.updated + " · 本周新开投（只放有本地封面的）" : "")
    : ((typeof COMPADS !== "undefined" && COMPADS && COMPADS.updated) ? COMPADS.updated : "");
  updated.textContent = upd ? `更新 ${upd}` : "";
  if (!items.length) {
    grid.innerHTML = "";
    empty.classList.remove("hidden");
    empty.textContent = viewKey === "korea"
      ? "韩国地区今日暂无竞品新开投条目（或未取到）。"
      : "今日暂无竞品新开投条目（或未取到）。";
    return;
  }
  empty.classList.add("hidden");
  const cards = items.map(renderCompadsCard).filter(Boolean);
  if (!cards.length) {
    grid.innerHTML = "";
    empty.classList.remove("hidden");
    empty.textContent = viewKey === "korea"
      ? "韩国地区今日暂无带封面的竞品条目。"
      : "今日暂无带封面的竞品条目（远程封面失效的已隐藏）。";
    return;
  }
  grid.innerHTML = cards.join("");
}


function renderView(key) {
  const view = REPORT.views[key];
  if (!view) return;

  document.getElementById("dateLine").textContent = view.dateLine || REPORT.dateLabel;

  const meta = (view.meta || [])
    .map(m => `<span><strong>${esc(m.k)}</strong> ${esc(m.v)}</span>`)
    .join("");

  document.getElementById("lead").innerHTML = `
    <div class="kicker">${esc(view.leadKicker)}</div>
    <p>${esc(view.lead)}</p>
    <div class="meta-row">${meta}</div>`;

  renderYtSection(key);
  renderCompads(key);

  document.getElementById("grid").innerHTML = (view.cards || []).map(renderCard).join("");

  document.querySelectorAll(".segments button").forEach(btn => {
    const on = btn.dataset.view === key;
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });

  history.replaceState(null, "", `#${key}`);
}

async function loadCompads() {
  try {
    if (location.protocol === "file:") return;
    const r = await fetch("competitor-ads-latest.json", {cache: "no-store"});
    if (!r.ok) return;
    const data = await r.json();
    if (data && Array.isArray(data.items)) {
      window.COMPADS = data;
      // re-render current view
      const key = (location.hash || "#overseas").replace("#", "") || "overseas";
      if (typeof renderCompads === "function") renderCompads(key);
    }
  } catch (e) {}
}
loadCompads();

const startKey = REPORT.views[initial] ? initial : "overseas";

async function boot() {
  try {
    const res = await fetch("./youtube-hotspots-1113.json", { cache: "no-store" });
    if (res.ok) {
      const live = await res.json();
      if (live && (live.themes || live.cards)) {
        ytData = {
          updated: live.updated,
          market: live.market,
          timezone: live.timezone,
          collected_at: live.collected_at,
          window: live.window,
          themes: live.themes || live.cards,
          stats: live.stats
        };
      }
    }
  } catch (e) {
    /* keep embedded YT_HOTSPOTS */
  }
  try {
    const r2 = await fetch("./youtube-hotspots-1113.json", { cache: "no-store" });
    if (r2.ok) { const j = await r2.json(); if (j && j.themes) ytByView.overseas = j; }
  } catch (e) { /* keep embedded YT_HOTSPOTS_OVERSEAS */ }
  try {
    const r3 = await fetch("./youtube-hotspots-weekly-1109.json", { cache: "no-store" });
    if (r3.ok) { const j = await r3.json(); if (j && j.themes) ytByView.weekly = j; }
  } catch (e) { /* keep embedded YT_HOTSPOTS_WEEKLY */ }
  renderView(startKey);
}

boot();
