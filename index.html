<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>素材雷达 · 11-05</title>
<style>
  :root {
    --bg: #f7f8fa;
    --bg-elev: #eef0f4;
    --bg-card: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #111827;
    --text-muted: #4b5563;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --green: #16a34a;
    --green-soft: #ecfdf5;
    --amber: #d97706;
    --amber-soft: #fffbeb;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.05);
    --radius: 14px;
    --gap: 20px;
    --max: 1120px;
    --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
      system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle editorial grain / top wash */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37,99,235,0.06), transparent 55%),
      radial-gradient(ellipse 40% 30% at 100% 0%, rgba(15,23,42,0.02), transparent 40%);
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  /* ——— Top bar ——— */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    background: rgba(255,255,255,0.88);
    border-bottom: 1px solid var(--border);
    margin: 0 -20px;
    padding: 16px 20px 14px;
  }

  .topbar-inner {
    max-width: var(--max);
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
  }

  .brand h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .brand .date {
    margin-top: 4px;
    font-size: 0.8125rem;
    color: var(--text-muted);
  }

  .segments {
    display: inline-flex;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .segments button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 560;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .segments button:hover { color: var(--text); }

  .segments button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 1px 2px rgba(37,99,235,0.25);
  }

  /* ——— Lead ——— */
  .lead {
    margin-top: 28px;
    padding: 18px 20px;
    background: linear-gradient(135deg, #eff6ff, #f8fafc);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius);
  }

  .lead .kicker {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .lead p {
    font-size: 0.975rem;
    color: var(--text);
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .meta-row span strong {
    color: var(--text-muted);
    font-weight: 600;
  }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
  }


  .badge-新出路 {
    background: var(--accent-soft);
    color: #1d4ed8;
    border-color: #bfdbfe;
  }

  .badge-上升速 {
    background: var(--green-soft);
    color: #15803d;
    border-color: #bbf7d0;
  }

  .badge-持续 {
    background: var(--amber-soft);
    color: #b45309;
    border-color: #fde68a;
  }

  /* ——— YouTube 热点 ——— */
  .yt-section {
    margin-top: 32px;
  }

  .yt-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 16px;
    margin-bottom: 16px;
  }

  .yt-head h2 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .yt-updated {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .yt-themes {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .yt-theme {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 2px);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    transition: border-color 0.18s;
  }

  .yt-theme:hover {
    border-color: var(--border-strong);
  }

  .yt-theme-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 12px;
    margin-bottom: 10px;
  }

  .yt-theme-head h3 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .yt-judgment {
    font-size: 0.9rem;
    color: #374151;
    line-height: 1.55;
    margin-bottom: 14px;
  }

  .yt-hint {
    margin-top: 28px;
    padding: 14px 16px;
    background: var(--bg-elev);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .yt-hint a {
    color: #2563eb;
    text-decoration: none;
  }

  .yt-hint a:hover { text-decoration: underline; }

  .section-label {
    margin-top: 36px;
    margin-bottom: -12px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }


  /* ——— 竞品投放日更 ——— */
  .compads-section {
    margin-top: 32px;
  }
  .compads-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 16px;
    margin-bottom: 14px;
  }
  .compads-head h2 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .compads-updated {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .badge-新开投 {
    background: var(--accent-soft);
    color: #1d4ed8;
    border-color: #bfdbfe;
  }
  .badge-在投 {
    background: var(--bg-elev);
    color: #374151;
    border-color: var(--border);
  }
  .badge-仿冒, .badge-⚠️仿冒 {
    background: #fef2f2;
    color: #b91c1c;
    border-color: #fecaca;
  }
  .compads-empty {
    margin-top: 8px;
    padding: 14px 16px;
    background: var(--bg-elev);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* ——— 多样性（2026-11-17）：题材分布条 / 今天的新东西 / 同类折叠 / 筛选 ——— */
  .gbar-section { margin-top: 16px; padding: 12px 16px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .gbar-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .gbar-head h2 { font-size: 0.9rem; font-weight: 650; }
  .gbar-warn { font-size: 0.75rem; color: #b45309; background: var(--amber-soft); border: 1px solid #fde68a; border-radius: 999px; padding: 2px 10px; }
  .gbar-ok { font-size: 0.75rem; color: #15803d; background: var(--green-soft); border: 1px solid #bbf7d0; border-radius: 999px; padding: 2px 10px; }
  .gbar-row { display: grid; grid-template-columns: 190px 1fr 112px; gap: 10px; align-items: center; margin: 5px 0; }
  .gbar-label { font-size: 0.75rem; color: var(--text-muted); line-height: 1.3; }
  .gbar-track { display: flex; height: 20px; border-radius: 6px; overflow: hidden; background: var(--bg-elev); }
  .gbar-seg { display: flex; align-items: center; justify-content: center; font-size: 0.66rem; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,0.45); white-space: nowrap; overflow: hidden; min-width: 2px; cursor: pointer; border-right: 1px solid rgba(255,255,255,0.7); }
  .gbar-seg:last-child { border-right: 0; }
  .gbar-seg.dim { opacity: 0.25; }
  .gbar-sum { font-size: 0.72rem; color: var(--text-dim); text-align: right; white-space: nowrap; }
  .gchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; align-items: center; }
  .gchips .gchips-t { font-size: 0.72rem; color: var(--text-dim); margin-right: 2px; }
  .gchip { appearance: none; border: 1px solid var(--border-strong); background: #fff; border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 0.72rem; color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .gchip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .gchip:hover { border-color: var(--accent); color: var(--text); }
  .gchip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .novel-section { margin-top: 14px; padding: 12px 16px; background: linear-gradient(135deg, #fffbeb, #fefce8); border: 1px solid #fde68a; border-radius: var(--radius); }
  .novel-section h2 { font-size: 0.9rem; font-weight: 650; color: #92400e; margin-bottom: 6px; }
  .novel-item { display: flex; gap: 10px; align-items: flex-start; margin: 7px 0; font-size: 0.84rem; line-height: 1.5; }
  .novel-tag { flex: none; font-size: 0.68rem; font-weight: 650; padding: 1px 8px; border-radius: 999px; background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; margin-top: 2px; white-space: nowrap; }
  .novel-item a { color: var(--accent); text-decoration: none; margin-left: 6px; white-space: nowrap; }
  .novel-item a:hover { text-decoration: underline; }
  .novel-empty { font-size: 0.82rem; color: var(--text-muted); }
  .fold { margin-top: 18px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: rgba(255,255,255,0.6); }
  .fold > summary { cursor: pointer; padding: 10px 16px; font-size: 0.84rem; color: var(--text-muted); list-style: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: "▸ "; }
  .fold[open] > summary::before { content: "▾ "; }
  .fold[open] > summary { border-bottom: 1px dashed var(--border-strong); }
  .fold .grid { padding: 16px; margin-top: 0; }
  .filter-note { margin-top: 12px; font-size: 0.8rem; color: var(--text-muted); }
  .filter-note button { appearance: none; border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; margin-left: 6px; }
  @media (max-width: 720px) { .gbar-row { grid-template-columns: 1fr; gap: 3px; } .gbar-sum { text-align: left; } }

  /* ===================== v2 素材墙（2026-11-18）：封面优先 + 点击看详情 ===================== */
  :root { --primary: #2563eb; --primary-soft: #eff6ff; --primary-line: #bfdbfe; }

  .topbar { padding: 12px 20px 0; }
  .topbar-inner { align-items: center; }
  .brand h1 { font-size: 1.25rem; }
  .anchors {
    max-width: var(--max);
    margin: 8px auto 0;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .anchors::-webkit-scrollbar { display: none; }
  .anchors button {
    appearance: none; border: 0; background: none; font: inherit; cursor: pointer;
    font-size: 0.8125rem; font-weight: 560; color: var(--text-muted);
    padding: 8px 12px 9px; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .anchors button:hover { color: var(--text); }
  .anchors button.on { color: var(--primary); border-bottom-color: var(--primary); }

  .top-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; align-items: stretch; }
  .top-grid > section { margin: 0; }
  .lead {
    flex: 1 1 560px; margin: 0; padding: 20px 24px 18px;
    background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
  }
  .today-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
  .today-head h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
  .today-head span { font-size: 0.78rem; color: var(--text-dim); }
  .today-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .today-list li { position: relative; padding-left: 18px; font-size: 0.93rem; line-height: 1.65; color: #1f2937; }
  .today-list li::before { content: ""; position: absolute; left: 2px; top: 0.72em; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  .today-list li b { font-weight: 700; color: var(--text); }
  .lead:not(.open) .today-list li { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lead:not(.open) .today-list li:nth-child(n+5) { display: none; }
  .lead:not(.open) .meta-row { display: none; }
  .today-more { appearance: none; border: 0; background: none; font: inherit; font-size: .8rem; color: var(--primary); cursor: pointer; padding: 8px 0 0; }
  .today-more:hover { text-decoration: underline; }
  .today-more .t-close, .lead.open .today-more .t-open { display: none; }
  .lead.open .today-more .t-close { display: inline; }
  .lead .meta-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 0.75rem; gap: 4px 16px; }
  .novel-section { flex: 1 1 340px; margin: 0; padding: 18px 20px; border-radius: 16px; align-self: stretch; }
  .novel-section h2 { font-size: 1.05rem; font-weight: 800; color: #92400e; margin-bottom: 8px; }

  .gbar-wrap { margin-top: 14px; background: #fff; border: 1px solid var(--border); border-radius: 14px; }
  .gbar-wrap > summary { cursor: pointer; padding: 11px 16px; font-size: 0.84rem; color: var(--text-muted); list-style: none; }
  .gbar-wrap > summary::-webkit-details-marker { display: none; }
  .gbar-wrap > summary::before { content: "▸ "; }
  .gbar-wrap[open] > summary::before { content: "▾ "; }
  .gbar-wrap .gbar-section { margin: 0; border: 0; box-shadow: none; border-top: 1px dashed var(--border-strong); border-radius: 0 0 14px 14px; }

  .sec-head, .yt-head, .compads-head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 4px 16px; margin: 0 0 14px;
  }
  .sec-head h2, .yt-head h2, .compads-head h2 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.015em; }
  .sec-sub, .yt-updated, .compads-updated { font-size: 0.78rem; color: var(--text-dim); }
  .wall-section { margin-top: 34px; scroll-margin-top: 108px; }
  .yt-section, .compads-section { margin-top: 44px; scroll-margin-top: 108px; }
  #lead { scroll-margin-top: 108px; }

  /* —— 素材墙 —— */
  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
    grid-auto-flow: dense;
    gap: 18px;
    align-items: stretch;
  }
  .fold .wall { padding: 16px; }
  .wall-card {
    position: relative;
    display: flex; flex-direction: column;
    grid-column: span 2;                       /* 横屏占 2 列；竖屏 / 方形 1 列 */
    order: 2;                                  /* 先竖屏组、后横屏组（卡上有 #排名）；图片加载后才判定方向的卡也会自动归位 */
    background: #fff; border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden; cursor: pointer;
    transition: transform .16s, box-shadow .16s, border-color .16s;
    outline: none;
  }
  .wall-card.is-portrait, .wall-card.is-square { grid-column: span 1; order: 1; }
  .wall-card.no-cover { grid-column: span 2; order: 3; }
  .wall-card.no-cover .card-body { padding: 16px 18px; gap: 8px; }
  .wall-card.no-cover .card-title { font-size: 1.04rem; }
  .wall-card.no-cover .card-chips { margin-bottom: 2px; }
  .wall-card:hover, .wall-card:focus-visible { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: 0 10px 28px rgba(15,23,42,.14); }
  .wall-card:focus-visible { box-shadow: 0 0 0 3px var(--primary-line); }

  .cover { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #111827; overflow: hidden; border-radius: 0; }
  .cover.is-portrait { aspect-ratio: 9 / 16; }
  .cover.is-square { aspect-ratio: 1 / 1; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #eef0f4, #dfe3ea); color: var(--text-dim); font-size: 3.5rem; font-weight: 700; }
  .cover-placeholder span { opacity: .45; }
  .cover::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none;
    background: linear-gradient(to top, rgba(8,12,24,.78), rgba(8,12,24,0)); }
  .cover-badges { position: absolute; top: 9px; left: 9px; z-index: 3; }
  .rank {
    position: absolute; top: 8px; right: 8px; z-index: 3;
    min-width: 34px; height: 26px; padding: 0 9px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(15,23,42,.82); color: #fff; font-size: .8rem; font-weight: 800; letter-spacing: .01em;
    backdrop-filter: blur(6px);
  }
  .cm { position: absolute; left: 10px; right: 10px; bottom: 9px; z-index: 3; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; color: #fff; }
  .cm-views { display: flex; align-items: baseline; gap: 4px; text-shadow: 0 1px 6px rgba(0,0,0,.5); line-height: 1; }
  .cm-views b { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
  .cm-views small { font-size: .72rem; opacity: .9; }
  .cm-r { display: flex; gap: 5px; align-items: center; }
  .cm-pill { font-size: .66rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; line-height: 1.4; }
  .cm-plat { background: rgba(255,255,255,.92); color: #111827; }

  .badge { display: inline-flex; align-items: center; flex: none; white-space: nowrap; font-size: .6875rem; font-weight: 700;
    line-height: 1.2; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; border: 1px solid transparent; }
  .cover-badges .badge { box-shadow: 0 1px 4px rgba(15,23,42,.28); }
  .badge-NEW, .badge-主榜, .badge-新出路, .badge-新开投 { background: var(--primary-soft); color: #1d4ed8; border-color: var(--primary-line); }
  .badge-Rising, .badge-上升速 { background: var(--green-soft); color: #15803d; border-color: #bbf7d0; }
  .badge-Trending, .badge-仍在爆, .badge-持续 { background: var(--amber-soft); color: #b45309; border-color: #fde68a; }
  .badge-neutral, .badge-在投 { background: var(--bg-elev); color: #374151; border-color: var(--border); }
  .badge-risk, .badge-仿冒, .badge-⚠️仿冒 { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

  .card-body { display: flex; flex-direction: column; gap: 7px; padding: 12px 14px 14px; flex: 1; min-width: 0; }
  .card-title { font-size: .96rem; font-weight: 700; line-height: 1.42; letter-spacing: -.005em; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-kv { font-size: .74rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-why { font-size: .8rem; line-height: 1.55; color: #4b5563; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-why em { font-style: normal; font-weight: 700; color: #b45309; margin-right: 4px; }
  .use-box { margin-top: auto; padding: 8px 10px; background: var(--primary-soft); border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0;
    font-size: .79rem; line-height: 1.55; color: #1e3a8a; }
  .use-box b { display: block; font-size: .68rem; font-weight: 800; letter-spacing: .04em; color: var(--primary); margin-bottom: 1px; }

function thumbSrc(t) {
  if (!t) return null;
  if (t.type === "yt") {
    return {
      primary: `https://i.ytimg.com/vi/${t.id}/maxresdefault.jpg`,
      fallback: `https://i.ytimg.com/vi/${t.id}/hqdefault.jpg`
    };
  }
  if (t.type === "x") {
    return { primary: `media/x_${t.id}.jpg`, fallback: null };
  }
  if (t.type === "local" && t.src) {
    return { primary: t.src, fallback: t.fallback || null };
  }
  if (t.type === "local") {
    return { primary: t.src, fallback: t.fallback || null };
  }
  return null;
}

function isPortraitUrl(url) {
  if (!url) return false;
  const u = String(url);
  return /youtube\.com\/shorts\//i.test(u) || /\/shorts\//i.test(u);
}

function isPortraitThumb(t, links) {
  if (!t) return false;
  if (t.portrait === true || t.orient === "portrait" || t.ar === "9:16") return true;
  if (t.portrait === false || t.orient === "landscape" || t.ar === "16:9") return false;
  if (Array.isArray(links) && links.some(l => isPortraitUrl(l && l.href))) return true;
  return false;
}

function markPortraitFromImg(img) {
  if (!img || !img.naturalWidth) return;
  const box = img.closest(".cover, .yt-ev-thumb") || img;
  // 卡片层级（article.wall-card）也要标记：墙的列宽（竖屏 1 列 / 横屏 2 列）靠它切换
  const art = box.classList.contains("cover") ? box.closest("article.wall-card") : null;
  // YouTube Shorts 的 maxres 常是 16:9 带黑边，不能据此取消竖屏；只在图本身更高时补标竖屏
  if (img.naturalHeight > img.naturalWidth * 1.08) {
    box.classList.add("is-portrait");
    img.classList.add("is-portrait");
    if (art) { art.classList.add("is-portrait"); art.classList.remove("is-square"); }
  }
  else if (box.classList.contains("cover") && !box.classList.contains("is-portrait") && img.naturalHeight >= img.naturalWidth * 0.92) {
    // 方形素材（如 1:1）按真实比例显示，不裁成横版
    box.classList.add("is-square");
    if (art && !art.classList.contains("is-portrait")) art.classList.add("is-square");
  }
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// 完整标签形如「主榜 · X · 搬运·原作者未知 · AI 未独立验证」：第一段是短标签，其余是 chip
function splitBadge(badge) {
  const parts = String(badge || "").split(" · ").map(s => s.trim()).filter(Boolean);
  return { head: parts[0] || "", rest: parts.slice(1) };
}

function badgeClass(badge) {
  const head = splitBadge(badge).head;
  const known = ["NEW", "主榜", "Rising", "Trending", "仍在爆", "新出路", "上升速", "持续", "新开投", "在投", "仿冒", "⚠️仿冒"];
  if (known.includes(head)) return `badge badge-${head}`;
  if (/风险|自查/.test(head)) return "badge badge-risk";
  if (/今日未扫到|同类还在火|趋势|主题|节点/.test(head)) return "badge badge-neutral";
  return "badge badge-NEW";
}

function renderChips(rest, extraHtml) {
  const chips = (rest || []).map(t => {
    const warn = /搬运|未知|未独立|未验证|可能|推广|投流|待核|存疑|风险/.test(t) ? " chip-warn" : "";
    return `<span class="chip${warn}">${esc(t)}</span>`;
  }).join("");
  return (chips || extraHtml) ? `<div class="card-chips">${extraHtml || ""}${chips}</div>` : "";
}

    const colon = /[：:]$/.test(mk.raw);
    const label = mk.br ? mk.raw.slice(1, -1) : mk.raw.replace(/[：:]$/, "");
    const g = groupOf(label);
    if (!mk.br && (g === "why" || g === "diff")) body = (label + (colon ? "：" : "") + body).trim();
    if (!body) return;
    let key = g;
    if (g === "other") key = "o:" + label;
    if (by[key]) by[key].text += " " + body;
    else { by[key] = { g, label, text: body }; order.push(key); }

}
function clip(t, n) {
  t = String(t || "").replace(/\s+/g, " ").trim();
  if (t.length <= n) return t;
  const cut = t.slice(0, n);
  const k = Math.max(cut.lastIndexOf("，"), cut.lastIndexOf("；"), cut.lastIndexOf("、"), cut.lastIndexOf("。"), cut.lastIndexOf("："));
  return (k > n * 0.55 ? cut.slice(0, k) : cut).replace(/[，、；：]$/, "") + "…";
}
function firstSent(t, n) {
  t = String(t || "").replace(/\s+/g, " ").trim();

  const s = (m ? m[0] : t).replace(/[。]$/, "");
  return clip(s, n);
}

/* 关键数据：播放量 / 时长 / 赞 / 收藏 / 评论 / 日期 / 平台 */
function cleanNum(s) { return String(s).replace(/\.0(?=\s|$)/, "").trim(); }
function pickMetrics(c) {
  const s = String(c.stats || ""), t = String(c.title || "");
  const o = {};
  let v = s.match(/(\d[\d.,]*)\s*(万|亿)\s*播放/);
  if (v) o.views = cleanNum(v[1]) + " " + v[2];
  else if ((v = s.match(/(\d[\d,]*)\s*播放/))) o.views = v[1];
  else if (!/^(仍在爆|趋势|同类还在火|节点|风险|自查|主题|Rising)/.test(String(c.badge || "")) && !/\d+\s*条/.test(s) && (t.match(/\d[\d.,]*\s*[万亿]/g) || []).length < 2 && (v = t.match(/(?:^|[^+＋×\d.,])(\d[\d.,]*)\s*(万|亿)/))) o.views = cleanNum(v[1]) + " " + v[2];
  if ((v = s.match(/(\d{1,3})\s*秒/))) { const n = +v[1]; o.dur = Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
  if ((v = s.match(/赞\s*([\d.,]+\s*[万亿]?)/))) o.likes = cleanNum(v[1]);
  if ((v = s.match(/收藏\s*([\d.,]+\s*[万亿]?)/))) o.saves = cleanNum(v[1]);
  if ((v = s.match(/(?:评论|回复)\s*([\d.,]+)/))) o.cmts = v[1];
  if ((v = s.match(/(?:^|[\s·])(\d\d-\d\d)(?=[\s·]|$)/))) o.date = v[1];
  return o;
}
function platOf(links) {
  const h = String((links && links[0] && links[0].href) || "");
  if (/x\.com|twitter\.com/i.test(h)) return "X";
  if (/youtube\.com\/shorts/i.test(h)) return "Shorts";
  if (/youtube\.com|youtu\.be/i.test(h)) return "YouTube";
  if (/facebook\.com/i.test(h)) return "Meta";
  if (/adstransparency\.google/i.test(h)) return "Google";
  if (/tiktok/i.test(h)) return "TikTok";

}
function kvLine(c) {
  const segs = String(c.stats || "").split(" · ").map(s => s.trim()).filter(Boolean);
  const keep = [];
  segs.forEach(sg => { if (/^(赞|收藏|评论|回复)\s*\d/.test(sg) && keep.length < 2) keep.push(sg); });
  const d = segs.find(sg => /^\d\d-\d\d(\s|$)/.test(sg));
  if (d) keep.push(d);
  if (!keep.length) return clip(segs.slice(0, 3).join(" · "), 44);
  return keep.join(" · ");
}

const ITEMS = [];   // 详情弹窗数据，按渲染顺序登记（卡片上 data-ci 指向这里）

function coverInner(card, letter, src) {

function renderCover(card, ctx) {

function stripLead(t) { return String(t).replace(/^热度来自[^：:。；]{0,24}[：:]?/, "").replace(/^[：:。\s]+/, "") || t; }

function renderCard(card, rank, opts) {
  opts = opts || {};

  const bd = splitBadge(card.badge);

  const kv = kvLine(card);
  const noCover = !thumbSrc((card.thumbs || [])[0]);

  const head = bodyBadge ? `<div class="card-chips">${rank ? `<span class="d-rank">#${rank}</span>` : ""}${bd.head ? `<span class="${badgeClass(card.badge)}">${esc(bd.head)}</span>` : ""}${bodyChips}</div>` : "";
  return `
    <article class="wall-card${portrait && !noCover ? " is-portrait" : ""}${noCover ? " no-cover" : ""}" data-ci="${ci}" tabindex="0" role="button" aria-label="${esc(card.title)}">

    </article>`;
}

/* ——— 弹窗内嵌播放器：按链接识别平台，用官方嵌入；识别不了/嵌入失败就退回封面 + “去原平台播放” ——— */
function embedInfo(href, link) {
  let u;
  try { u = new URL(String(href || ""), location.href); } catch (e) { return null; }
  if (/\.(mp4|webm)$/i.test(u.pathname) && (u.origin === location.origin || u.protocol === "file:")) {
    const o = link && link.orient;
    return { plat: "本地视频", id: u.href, orient: o === "port" ? "port" : o === "sq" ? "sq" : "land", kind: "mp4", poster: link && link.poster };
  }
  const h = u.hostname.replace(/^(www|m|mobile)\./i, "").toLowerCase(), path = u.pathname;
  let m;
  if (h === "youtu.be" && (m = path.match(/^\/([\w-]{11})/))) return { plat: "YouTube", id: m[1], orient: "land", kind: "yt" };
  if (/(^|\.)youtube(-nocookie)?\.com$/.test(h)) {
    if ((m = path.match(/^\/shorts\/([\w-]{11})/))) return { plat: "YouTube Shorts", id: m[1], orient: "port", kind: "yt" };
    if ((m = path.match(/^\/(?:embed|live|v)\/([\w-]{11})/))) return { plat: "YouTube", id: m[1], orient: "land", kind: "yt" };
    if (path === "/watch" && (m = (u.searchParams.get("v") || "").match(/^[\w-]{11}$/))) return { plat: "YouTube", id: m[0], orient: "land", kind: "yt" };
    return null;
  }
  if (h === "x.com" || h === "twitter.com") {
    if ((m = path.match(/\/status(?:es)?\/(\d{5,25})/))) return { plat: "X", id: m[1], orient: "port", kind: "x" };
    return null;
  }
  if (h === "tiktok.com") {
    if ((m = path.match(/\/video\/(\d{8,25})/))) return { plat: "TikTok", id: m[1], orient: "port", kind: "tt" };
    return null;
  }
  if (h === "instagram.com") {
    if ((m = path.match(/\/(p|reel|reels|tv)\/([\w-]+)/))) return { plat: "Instagram", id: m[2], seg: m[1] === "reels" ? "reel" : m[1], orient: "port", kind: "ig" };
    return null;
  }
  return null;
}
function embedSrc(em) {
  if (em.kind === "yt") {
    const o = /^https?:$/.test(location.protocol) ? "&origin=" + encodeURIComponent(location.origin) : "";
    return `https://www.youtube-nocookie.com/embed/${em.id}?autoplay=1&playsinline=1&rel=0&enablejsapi=1${o}`;
  }
  if (em.kind === "tt") return `https://www.tiktok.com/player/v1/${em.id}?autoplay=1&music_info=0&description=0&rel=0`;
  if (em.kind === "x") return `https://platform.twitter.com/embed/Tweet.html?id=${em.id}&theme=dark&dnt=true&hideThread=true&lang=zh-cn`;
  if (em.kind === "ig") return `https://www.instagram.com/${em.seg}/${em.id}/embed/`;
  return "";
}

  d.querySelector(".dlg-nav.prev").disabled = i <= 0;
  d.querySelector(".dlg-nav.next").disabled = i < 0 || i >= list.length - 1;
  if (d.classList.contains("hidden")) { DLG_LAST = document.activeElement; d.classList.remove("hidden"); document.body.classList.add("dlg-open"); }
  panel.querySelector(".dlg-main").scrollTop = 0;
  panel.querySelector(".dlg-x").focus({ preventScroll: true });
}
function closeDlg() {
  const d = document.getElementById("dlg");
  if (!d || d.classList.contains("hidden")) return;
  destroyPlayer();                       // 先销毁 iframe，声音立刻停
  d.querySelector("#dlg-panel").innerHTML = "";
  DLG_ST = null;
  d.classList.add("hidden");
  document.body.classList.remove("dlg-open");
  if (DLG_LAST && DLG_LAST.focus) DLG_LAST.focus({ preventScroll: true });
  DLG_EL = null;
}
function stepDlg(n) {
  const list = dlgItems(), i = list.indexOf(DLG_EL);
  if (i < 0 || !list[i + n]) return;
  openDlg(list[i + n]);
}
document.addEventListener("click", e => {
  const card = e.target.closest(".wall-card");
  if (card && card.dataset.ci !== undefined && !e.target.closest("a")) openDlg(card);
  const sc = e.target.closest("[data-scroll]");
  if (sc) { const t = document.getElementById(sc.dataset.scroll); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
document.addEventListener("keydown", e => {
  const open = document.getElementById("dlg") && !document.getElementById("dlg").classList.contains("hidden");
  if (open) {
    if (e.key === "Escape") { e.preventDefault(); closeDlg(); }
    else if (e.key === "ArrowLeft") stepDlg(-1);
    else if (e.key === "ArrowRight") stepDlg(1);
  } else if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("wall-card")) {
    e.preventDefault(); openDlg(e.target);
  }
});

function renderEvidence(ev) {
  const thumb = ev.thumb || ev.thumbnail || (ev.id ? `https://i.ytimg.com/vi/${ev.id}/maxresdefault.jpg` : "");
  const fallback = ev.id ? `https://i.ytimg.com/vi/${ev.id}/hqdefault.jpg` : "";
  const vm = ev.views_label ? String(ev.views_label) : (ev.stats ? String(ev.stats).split("·")[0].replace(/播放/, "").trim() : "");
  const dur = ev.duration_label ? esc(ev.duration_label) : "";
  const portrait = ev.portrait === true || isPortraitUrl(ev.url) || (ev.format === "shorts");
  const onerr = fallback
    ? `onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${esc(fallback)}';}else{this.style.opacity='0.3';}"`
    : "";
  return `
    <a class="yt-ev" href="${esc(ev.url || '#')}" target="_blank" rel="noopener noreferrer" title="${esc(ev.title || '')}">
      <div class="yt-ev-thumb${portrait ? " is-portrait" : ""}">
        <img src="${esc(thumb)}" alt="${esc(ev.title || '')}" loading="lazy" decoding="async" onload="markPortraitFromImg(this)" ${onerr} />
        ${dur ? `<span class="yt-ev-play">${dur}</span>` : ""}
      </div>
      <div class="yt-ev-meta">
        <div class="yt-ev-title">${esc(ev.title || "")}</div>
        <div class="yt-ev-views">${vm ? `<b>${esc(vm)}</b>播放` : ""}${ev.channel ? (vm ? " · " : "") + esc(ev.channel) : ""}</div>
        ${ev.sponsored ? `<div class="card-chips"><span class="chip chip-warn">推广 / 活动链接</span></div>` : ""}
      </div>
    </a>`;
}

function renderYtTheme(theme) {
  const evidence = (theme.evidence || theme.videos || []).slice(0, 4);
  const p = parseAnalysis(theme.judgment || "");
  const body = (p.lead || "") + (p.has ? "" : "");
  const rest = ["why", "look", "cmt", "diff"].map(k => p.by[k] ? p.by[k].text : "").filter(Boolean).join(" ");
  const use = p.by.use ? `<div class="use-box"><b>怎么用到 Topview</b><span>${esc(p.by.use.text)}</span></div>` : "";
  return `
    <article class="yt-theme">
      <div class="yt-theme-head">
        <span class="${badgeClass(theme.badge)}">${esc(splitBadge(theme.badge).head)}</span>
        <h3>${esc(theme.title || "")}</h3>
        ${renderChips(splitBadge(theme.badge).rest)}
      </div>
      <div class="yt-theme-body">
        <div class="yt-text">
          <p class="yt-judgment">${esc((body + " " + rest).trim())}</p>
          ${use}
        </div>
        ${evidence.length ? `<div class="yt-evidence">${evidence.map(renderEvidence).join("")}</div>` : ""}
      </div>
    </article>`;
}

function renderYtSection(viewKey) {
  const section = document.getElementById("yt-section");
  const hint = document.getElementById("yt-hint");
  const themesEl = document.getElementById("yt-themes");
  const updatedEl = document.getElementById("yt-updated");

  const showFull = viewKey === "weekly" || viewKey === "overseas";
  const yd = (typeof ytByView !== "undefined" && ytByView[viewKey]) || ytData;
  const showHint = viewKey === "korea";

  if (showFull && yd && (yd.themes || []).length) {
    section.classList.remove("hidden");
    hint.classList.add("hidden");
    const upd = yd.updated || "";
    const win = yd.window ? ` · ${yd.window}` : "";

    themesEl.innerHTML = yd.themes.map(renderYtTheme).join("");

  } else {
    section.classList.add("hidden");

function filterCompads(viewKey) {
  const items = (typeof COMPADS !== "undefined" && COMPADS && COMPADS.items) ? COMPADS.items : [];
  if (viewKey === "korea") {
    return items.filter(it => (it.regions || []).includes("KR"));
  }
  if (viewKey === "overseas") {
    // KR-only items belong to the Korea view (added 2026-11-02 by KR daily)
    return items.filter(it => { const r = it.regions || []; return !(r.length === 1 && r[0] === "KR"); });
  }
  if (viewKey === "weekly") {
    return (typeof WEEKLY_COMPADS !== "undefined" && WEEKLY_COMPADS && WEEKLY_COMPADS.items) ? WEEKLY_COMPADS.items : [];
  }
  return [];
}

function hasUsableCover(cover) {
  if (!cover) return false;
  const c = String(cover);
  // Meta fbcdn / remote CDN covers expire or 403 — only local media counts for the page
  if (c.startsWith("media/")) return true;
  if (c.startsWith("./media/")) return true;
  if (c.startsWith("/media/")) return true;
  return false;
}

/* 2026-11-24：Google 透明度中心的视频广告页在别人浏览器里常是灰块 → 卡片必须带可播放视频
   （本地 mp4 或 YouTube 原片内嵌），透明度中心链接降为次要；拿不到视频的 Google 卡不渲染。 */
function isGatcItem(it) {
  return it && it.platform === "google" && /adstransparency\.google\.com/.test(String(it.gatc_link || it.link || ""));
}
function compadsVideoOk(it) {
  if (!isGatcItem(it)) return true;
  if (it.video_status !== "ok" || !it.yt_id) return false;
  return it.player === "youtube" || hasUsableCover(it.video || "");
}
function fmtDur(sec) {
  sec = Math.round(+sec || 0);
  if (!sec) return "";
  const m = Math.floor(sec / 60), s2 = sec % 60;
  return m + ":" + String(s2).padStart(2, "0");
}
function compadsLinks(it) {
  const out = [];
  const gatc = it.gatc_link || (isGatcItem(it) ? it.link : "");
  const yt = it.yt_url || (it.yt_id ? `https://www.youtube.com/watch?v=${it.yt_id}` : "");
  const dur = fmtDur(it.yt_duration);
  if (it.video && it.player !== "youtube") out.push({ title: `广告视频${dur ? " · " + dur : ""}（本地）`, href: it.video, orient: it.video_orient || "land", poster: it.cover });
  if (yt) out.push({ title: `YouTube 原片${dur ? " · " + dur : ""}${it.yt_channel ? " · " + it.yt_channel : ""}`, href: yt });
  if (gatc) out.push({ title: "Google 透明度中心（次要，页面常显示灰块）", href: gatc });
  else if (it.link && it.link !== yt) out.push({ title: "查看广告", href: it.link });
  return out;
}
function renderCompadsCard(it) {
  const badge = it.badge || (it.is_new ? "新开投" : "在投");
  const cover = it.cover || "";
  if (!hasUsableCover(cover)) return "";
  if (!compadsVideoOk(it)) return "";
  const plat = ({meta:"Meta", google:"Google", tiktok:"TikTok"}[it.platform] || it.platform || "");
  const regs = (it.regions || []).join("/");
  const card = {
    badge,
    title: it.title || (it.competitor + " · " + plat),
    stats: it.stats || [plat, regs, it.first_shown ? ("首投 " + it.first_shown) : ""].filter(Boolean).join(" · "),
    analysis: it.analysis || it.copy || "",
    links: compadsLinks(it),
    thumbs: [{ type: "local", src: cover, portrait: it.video_orient === "port" ? true : (it.video_orient ? false : undefined) }]
  };
  const chips = [it.competitor, plat, regs && ("地区 " + regs), it.first_shown && ("首投 " + it.first_shown), it.yt_id && ("▶ 视频 " + fmtDur(it.yt_duration))].filter(Boolean);
  return renderCard(card, 0, { plat: "", chips, removeOnError: true, badgeInBody: true });
}

function renderCompads(viewKey) {
  const section = document.getElementById("compads-section");
  const grid = document.getElementById("compads-grid");
  const empty = document.getElementById("compads-empty");
  const updated = document.getElementById("compads-updated");
  if (!section || !grid) return;
  const items = filterCompads(viewKey).filter(compadsVideoOk);
  const h2 = section.querySelector("h2");
  if (h2) h2.textContent = viewKey === "weekly" ? "竞品本周新开投" : "竞品投放日更";
  if (viewKey === "weekly" && !items.length) {
    section.classList.add("hidden");
    updateAnchors();
    return;
  }
  section.classList.remove("hidden");
  const upd = viewKey === "weekly"
    ? ((typeof WEEKLY_COMPADS !== "undefined" && WEEKLY_COMPADS) ? WEEKLY_COMPADS.updated + " · 本周新开投（只放有本地封面的）" : "")
    : ((typeof COMPADS !== "undefined" && COMPADS && COMPADS.updated) ? COMPADS.updated : "");
  updated.textContent = upd ? `更新 ${upd}` : "";
  if (!items.length) {
    grid.innerHTML = "";
    empty.classList.remove("hidden");
    empty.textContent = viewKey === "korea"
      ? "韩国地区今日暂无竞品新开投条目（或未取到）。"
      : "今日暂无竞品新开投条目（或未取到）。";
    updateAnchors();
    return;
  }
  empty.classList.add("hidden");
  const cards = items.map(renderCompadsCard).filter(Boolean);
  if (!cards.length) {
    grid.innerHTML = "";
    empty.classList.remove("hidden");
    empty.textContent = viewKey === "korea"
      ? "韩国地区今日暂无带封面的竞品条目。"
      : "今日暂无带封面的竞品条目（远程封面失效的已隐藏）。";
    updateAnchors();
    return;
  }
  grid.innerHTML = cards.join("");
  updateAnchors();
}

}
function renderToday(view) {
  const raw = String(view.lead || "").trim();
  let sents = (raw.match(/[^。]+。?/g) || []).map(s => s.trim()).filter(Boolean);
  if (sents.length < 3) sents = sents.flatMap(s => s.split(/；/).map((x, i, a) => (x.trim() + (i < a.length - 1 ? "。" : ""))).filter(Boolean));
  if (sents.length > 3) { const f = sents.filter(s => !/^(主榜|精选)\s*\d/.test(s)); if (f.length >= 3) sents = f; }
  sents = sents.slice(0, 5);
  const li = sents.map(s => {
    const m = s.match(/^([^：:，,]{1,16})[：:](.+)$/);
    return `<li>${m ? `<b>${esc(m[1])}：</b>${esc(m[2])}` : esc(s)}</li>`;
  }).join("");
  const meta = (view.meta || []).map(m => `<span><strong>${esc(m.k)}</strong> ${esc(m.v)}</span>`).join("");
  document.getElementById("lead").innerHTML = `
    <div class="today-head"><h2>${view.leadKicker && /结论/.test(view.leadKicker) ? esc(view.leadKicker) : "今天结论"}</h2><span>${esc(view.leadKicker && !/结论/.test(view.leadKicker) ? view.leadKicker : "")}</span></div>
    <ul class="today-list">${li}</ul>
    <div class="meta-row">${meta}</div>
    <button type="button" class="today-more" onclick="this.closest('.lead').classList.toggle('open')"><span class="t-open">展开全部 ▾</span><span class="t-close">收起 ▴</span></button>`;
  document.getElementById("lead").classList.remove("open");
}
function updateWallCount() {
  const n = document.querySelectorAll("#grid .wall-card").length;
  const f = document.querySelectorAll("#fold-area .wall-card").length;
  const el = document.getElementById("wall-count");
  if (el) el.textContent = n + " 条" + (f ? `（另有同类折叠 ${f} 条）` : "") + " · 点击卡片看详情";

  if (wrap && gs) { wrap.classList.toggle("hidden", gs.classList.contains("hidden")); if (GFILTER) wrap.open = true; }

}

  const max = nMain <= 4 ? 1 : (GENRE_DATA.maxPer || 2);   // 主榜 ≤4 条：每题材 1 条；≥5 条：每题材最多 2 条
  const mainGenres = new Set(cards.filter(c => isMainCard(key, c)).map(cardGenre));
  const seen = {}, shown = [], folded = [];
  cards.forEach(c => {
    if (isMetaCard(c)) { shown.push({ c, g: null }); return; }
    const g = cardGenre(c);
    if (isMainCard(key, c)) {
      seen[g] = (seen[g] || 0) + 1;
      if (c.fold === true || seen[g] > max) folded.push({ c, g }); else shown.push({ c, g });
    } else if (key !== "weekly" && mainGenres.has(g)) {
      folded.push({ c, g });   // 主题 / 趋势卡：同题材主榜已有 → 折叠为“同类还在火”
    } else shown.push({ c, g });
  });
  const f = GFILTER;
  const vis = list => f ? list.filter(x => x.g === f) : list;
  const rankOf = new Map(); let _rk = 0;
  shown.forEach(x => { if (isMainCard(key, x.c)) rankOf.set(x.c, ++_rk); });
  document.getElementById("grid").innerHTML = vis(shown).map(x => renderCard(x.c, rankOf.get(x.c) || 0)).join("");
  const fold = document.getElementById("fold-area");
  const fv = vis(folded);
  if (fv.length) {
    const cnt = countBy(folded.map(x => x.g));
    const parts = Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${(GENRE_BY_KEY[k] || { short: k }).short} ${n}`).join(" · ");
    fold.innerHTML = `<summary>同类还在火 · 已折叠 ${folded.length} 条（${esc(parts)}）——点开看</summary><div class="wall">${fv.map(x => renderCard(x.c, 0)).join("")}</div>`;
    fold.classList.remove("hidden");
    fold.open = !!f;
  } else { fold.classList.add("hidden"); fold.innerHTML = ""; }
  const note = document.getElementById("filter-note");
  if (f) {
    const g = GENRE_BY_KEY[f] || { label: f };
    note.innerHTML = `当前只看：<strong>${esc(g.label)}</strong>（${vis(shown).length + fv.length} 条；仍在爆 / 节点 / 风险卡已隐藏）<button type="button" onclick="setGenreFilter('${f}')">取消筛选</button>`;
    note.classList.remove("hidden");
  } else note.classList.add("hidden");
}

  renderCardsArea(CURRENT_VIEW, view);
  updateWallCount();
}

function renderView(key) {
  const view = REPORT.views[key];
  if (!view) return;

  document.getElementById("dateLine").textContent = view.dateLine || REPORT.dateLabel;

  renderToday(view);

  renderYtSection(key);
  renderCompads(key);

  if (CURRENT_VIEW !== key) GFILTER = null;
  CURRENT_VIEW = key;
  refreshDiversity();

  document.querySelectorAll(".segments button").forEach(btn => {
    const on = btn.dataset.view === key;
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });

  updateWallCount();
  history.replaceState(null, "", `#${key}`);
}

async function loadCompads() {
  try {
    if (location.protocol === "file:") return;
    const r = await fetch("competitor-ads-latest.json", {cache: "no-store"});
    if (!r.ok) return;
    const data = await r.json();
    if (data && Array.isArray(data.items)) {
      window.COMPADS = data;
      // re-render current view
      const key = (location.hash || "#overseas").replace("#", "") || "overseas";
      if (typeof renderCompads === "function") renderCompads(key);
    }
  } catch (e) {}
}
loadCompads();

const startKey = REPORT.views[initial] ? initial : "overseas";

async function boot() {
  try {
    const res = await fetch("./youtube-hotspots-1125.json", { cache: "no-store" });
    if (res.ok) {
      const live = await res.json();
      if (live && (live.themes || live.cards)) {
        ytData = {
          updated: live.updated,
          market: live.market,
          timezone: live.timezone,
          collected_at: live.collected_at,
          window: live.window,
          themes: live.themes || live.cards,
          stats: live.stats
        };
      }
    }
  } catch (e) {
    /* keep embedded YT_HOTSPOTS */
  }
  try {
    const r2 = await fetch("./youtube-hotspots-1125.json", { cache: "no-store" });
    if (r2.ok) { const j = await r2.json(); if (j && j.themes) ytByView.overseas = j; }
  } catch (e) { /* keep embedded YT_HOTSPOTS_OVERSEAS */ }
  try {
    const r3 = await fetch("./youtube-hotspots-weekly-1123.json", { cache: "no-store" });

  } catch (e) { /* keep embedded YT_HOTSPOTS_WEEKLY */ }
  renderView(startKey);
}

boot();
